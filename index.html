    <!-- link play cdn of tailwindcss -->

  </head>
  <body>

    <!-- there are 5 breakpoints in tailwindcss (sm, md, lg, xl, 2xl) -->

    <!-- when breakpoints using as prefix it will use for responsive -->
    <div class="p-8 text-2xl bg-amber-400 after:content-['smallest'] sm:bg-amber-500 sm:after:content-['small'] md:bg-amber-600 md:after:content-['medium'] lg:bg-amber-700 lg:after:content-['large'] xl:bg-amber-800 xl:after:content-['extralarge']">
      Content
    </div>


    <!--  pseudo class in tailwindcss-->
      <button class="bg-violet-500 hover:bg-violet-600 focus:outline-2 focus:outline-offset-2 focus:outline-violet-500 active:bg-amber-500 mt-4 p-4 rounded">
       <a href="https://devtron.ai/" class="visited:text-pink-500">Devtrons</a>
</button>

    <input type="text" class="required:border-red-500 placeholder:italic placeholder:text-pink-300 border" required placeholder="please input the info">

    <!-- pseudo element -->
     <ul role="list " class="mt-8 border p-4">
    <!-- Remove top/bottom padding when first/last child -->
    <li class="flex py-4 first:pt-0 last:pb-0 first:bg-amber-100 odd:bg-pink-100">
      <img class="h-10 w-10 rounded-full" src="./photos/1.jpg" alt="" />
